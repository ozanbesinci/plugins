name: Kılıç supplier runtime tests

on:
  pull_request:
    paths:
      - 'kilic-tedarikci-yonetimi/**'
      - '.github/workflows/kilic-supplier-tests.yml'
      - '.github/scripts/run_supplier_ci.py'
  push:
    branches: [main]
    paths:
      - 'kilic-tedarikci-yonetimi/**'
      - '.github/workflows/kilic-supplier-tests.yml'
      - '.github/scripts/run_supplier_ci.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-engines:
    runs-on: windows-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, duckdb]
    env:
      TEST_ENGINE: ${{ matrix.engine }}
    defaults:
      run:
        working-directory: kilic-tedarikci-yonetimi/plugins/kilic-satinalma/skills/teklif-degerlendirme
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6
        with:
          python-version: '3.14'
      - name: Install test dependencies in isolated CI runner
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ../../../../kurulum/requirements-win-cp314.lock
      - name: Prepare pinned local calculation engine in isolated CI runner
        run: |
          python -X utf8 -I -B ../../../../kurulum/calculation_install.py --prepared-environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B scripts/environment_check.py --strict --output test-results/ci-environment.json
      - name: Run the real engine with exact parallel coverage
        run: |
          python -X utf8 -B ../../../../../.github/scripts/run_supplier_ci.py --engine $env:TEST_ENGINE --output-dir test-results
      - name: Require complete nonempty current-source evidence
        run: |
          python -c "import json,os,pathlib,sys; sys.path.insert(0,'scripts'); from run_tests import validate_child_report,source_fingerprint; engine=os.environ['TEST_ENGINE']; path=pathlib.Path('test-results',engine+'.json'); r=json.loads(path.read_text(encoding='utf-8')); expected=source_fingerprint(); assert expected; assert validate_child_report(path,engine,r['run_id'],0,expected_source=expected)==0; print(engine, r['passed'], 'PASS, actual connection and source verified', r['source_sha256'])"
      - name: Keep actual engine JSON and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: kilic-supplier-real-engine-evidence-${{ matrix.engine }}
          path: |
            kilic-tedarikci-yonetimi/plugins/kilic-satinalma/skills/teklif-degerlendirme/test-results/*.json
            kilic-tedarikci-yonetimi/plugins/kilic-satinalma/skills/teklif-degerlendirme/test-results/*.log
          retention-days: 30
          if-no-files-found: warn
